<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Surtidor Guadalajara</title>
<meta name="description" content="Precios de gasolina, diésel y GLP en las gasolineras de la provincia de Guadalajara, con datos oficiales del Ministerio.">
<meta name="theme-color" content="#1c2226">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c2226'/%3E%3Cpath d='M9 7h10v18H9z' fill='%23ffc233'/%3E%3Cpath d='M11 9h6v5h-6z' fill='%231c2226'/%3E%3Cpath d='M19 12h3l2 3v8a1.5 1.5 0 0 1-3 0v-5h-2' fill='none' stroke='%23ffc233' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --asphalt:#1c2226;
  --bg:#f3f4f1;
  --panel:#ffffff;
  --ink:#1c2226;
  --muted:#5f6a70;
  --line:#dde1dc;
  --chip:#eceee9;
  --accent:#ffc233;        /* amarillo surtidor */
  --accent-ink:#1c2226;
  --cheap:#1e9e5a;
  --mid:#d99a00;
  --dear:#d2453a;
  --none:#9aa3a7;
  --focus:#1560bd;
  --shadow:0 1px 2px rgba(20,28,32,.08),0 6px 20px rgba(20,28,32,.10);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121719;--panel:#1a2023;--ink:#e8ebe7;--muted:#9aa6ab;--line:#2c3439;--chip:#232b2f;
    --cheap:#35c07a;--mid:#f0b429;--dear:#ef6a5e;--none:#6d777c;--focus:#6aa8ff;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121719;--panel:#1a2023;--ink:#e8ebe7;--muted:#9aa6ab;--line:#2c3439;--chip:#232b2f;
  --cheap:#35c07a;--mid:#f0b429;--dear:#ef6a5e;--none:#6d777c;--focus:#6aa8ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- barra superior ---------- */
.top{background:var(--asphalt);color:#f2f3ef;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand h1{font:700 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em;margin:0;text-transform:uppercase}
.brand small{display:block;font:500 12px/1.2 Barlow,sans-serif;color:#aab4b8;letter-spacing:.02em;text-transform:none}
.fuels{display:flex;gap:4px;background:#2a3237;padding:4px;border-radius:10px}
.fuels button{border:0;background:transparent;color:#cfd6d9;padding:6px 12px;border-radius:7px;cursor:pointer;font:600 15px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.fuels button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fuels button:hover:not([aria-pressed="true"]){background:#353e44;color:#fff}
.actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #3a444a;background:#262e33;color:#f2f3ef;padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:#313a40}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn svg{width:17px;height:17px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- estado ---------- */
.status{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:7px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.status b{color:var(--ink);font-weight:600}
.status .err{color:var(--dear);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.legend{display:flex;gap:12px;margin-left:auto}

/* ---------- cuerpo ---------- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:380px 1fr}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.side-head{padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid var(--line)}
.side-head input,.side-head select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.summary{grid-column:1/-1;font-size:13px;color:var(--muted)}
.radius{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.radius button{border:1px solid var(--line);background:var(--bg);padding:5px 11px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--ink)}
.radius button[aria-pressed="true"]{background:var(--asphalt);border-color:var(--asphalt);color:var(--accent)}
.best{grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--chip);border:2px solid var(--accent);cursor:pointer}
.best .k{grid-column:1/-1;font:600 12px/1.2 "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.best .n{font-weight:700;font-size:16px}
.best .w{grid-column:1;font-size:13px;color:var(--muted)}
.best .plate{grid-row:2/span 2;grid-column:2}
.suggest{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.suggest button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px}
.suggest button:hover{background:var(--chip);border-color:var(--muted)}
.suggest button small{color:var(--muted);font-weight:500;margin-left:4px}
.place{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:13px;background:var(--chip);border-radius:8px;padding:6px 10px}
.place b{color:var(--ink)}
.place button{margin-left:auto;border:0;background:transparent;color:var(--focus);font-weight:600;cursor:pointer;padding:2px 4px;text-decoration:underline}
.place-dot{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--asphalt);box-shadow:0 0 0 6px rgba(255,194,51,.3)}
.opts{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:600;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--cheap);margin:0}
.car input{width:52px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:right;font-variant-numeric:tabular-nums}
.save{display:block;font-size:12px;font-weight:600;margin-top:2px}
.save.pos{color:var(--cheap)} .save.neg{color:var(--muted);font-weight:500}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 5px;border-radius:4px;background:var(--dear);color:#fff;margin-left:6px;vertical-align:1px}
.item.closed .name,.item.closed .where{opacity:.6}
.pin.closed{opacity:.5}
.best .x{grid-column:1/-1;font-size:13px;margin-top:4px;padding-top:6px;border-top:1px solid var(--line)}
.best .x b{color:var(--cheap)}
.pop .open{font-size:13px;font-weight:600;margin-bottom:8px}
.pop .open.y{color:var(--cheap)} .pop .open.n{color:var(--dear)}
.pop .fill{font-size:13px;margin-bottom:10px;padding:8px;border-radius:8px;background:var(--chip)}
.pop .fill b{font-variant-numeric:tabular-nums}
.best.msg{display:block;border-style:dashed;border-color:var(--line);color:var(--muted);cursor:default}
.list{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover,.item.sel{background:var(--chip)}
.rank{font:600 13px/1 "Barlow Condensed",sans-serif;color:var(--muted);width:22px;text-align:right;font-variant-numeric:tabular-nums}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.where{grid-column:2;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-4px}
.price{grid-row:1/span 2;grid-column:3;text-align:right}
.plate{display:inline-block;background:var(--asphalt);color:#fff;font:700 21px/1 "Barlow Condensed",sans-serif;padding:5px 8px 4px;border-radius:6px;font-variant-numeric:tabular-nums;border-bottom:3px solid var(--c,var(--none))}
.plate sub{font-size:12px;vertical-align:baseline;margin-left:1px;color:#b9c2c6;font-weight:600}
.dist{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.empty{padding:24px 16px;color:var(--muted)}

#map{min-height:0;background:#dfe3dc}
.leaflet-container{font:inherit}

/* marcadores: mini totem de precio */
.pin{position:relative;transform:translate(-50%,-100%);display:inline-block}
.pin span{display:block;background:var(--asphalt);color:#fff;font:700 14px/1 "Barlow Condensed",sans-serif;padding:4px 6px 3px;border-radius:5px;border-bottom:3px solid var(--c);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.pin::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--c);border-bottom:0}
.pin.sel span{outline:2px solid var(--accent);outline-offset:1px;transform:scale(1.15)}
.pin.na span{background:#7c868b;border-bottom-color:#7c868b;font-size:11px;opacity:.85}
.pin.na::after{border-top-color:#7c868b}
.me-dot{width:16px;height:16px;border-radius:50%;background:var(--focus);border:3px solid #fff;box-shadow:0 0 0 6px rgba(21,96,189,.25)}

.leaflet-popup-content-wrapper{border-radius:10px;background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:12px 14px;min-width:220px}
.pop h3{margin:0 0 2px;font:700 19px/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em}
.pop .addr{color:var(--muted);font-size:13px;margin-bottom:8px}
.pop table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-bottom:8px}
.pop td{padding:3px 0;border-top:1px solid var(--line)}
.pop td:last-child{text-align:right;font-weight:600}
.pop tr.cur td{color:var(--ink);font-weight:700}
.pop .hours{font-size:12px;color:var(--muted);margin-bottom:10px}
.pop a.go{display:flex;justify-content:center;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;padding:8px;border-radius:8px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--asphalt);color:#fff;padding:9px 14px;border-radius:9px;box-shadow:var(--shadow);z-index:2000;font-weight:500;max-width:calc(100% - 32px)}

/* ---------- móvil: mapa a pantalla completa y lista en panel deslizante ---------- */
@media (max-width:760px){
  .top{gap:6px 10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  .brand svg{width:26px;height:26px}
  .brand h1{font-size:17px}
  .brand small{display:none}
  .fuels{order:3;width:100%;padding:3px}
  .fuels button{flex:1;padding:8px 2px;font-size:14px}
  .btn{padding:8px 10px}
  .btn .lbl{display:none}
  .legend{display:none}
  .status{padding:5px 12px;font-size:12px}

  .main{display:block;position:relative}
  #map{position:absolute;inset:0;width:100%;height:100%}
  .side{position:absolute;left:0;right:0;bottom:0;z-index:1200;border-right:0;
        border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(20,28,32,.18);
        height:52%;transition:height .25s ease}
  .side.max{height:88%}
  .side.min{height:calc(46px + env(safe-area-inset-bottom,0px))}
  .side-head{padding:10px 14px}
  .list{padding-bottom:env(safe-area-inset-bottom,0px)}
  .side .grab{display:block}
  .leaflet-control-attribution{max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
.grab{display:none;border:0;background:transparent;width:100%;padding:8px 0 4px;cursor:pointer}
.grab i{display:block;margin:0 auto;width:44px;height:5px;border-radius:3px;background:var(--muted);opacity:.55}
.grab b{display:none}
@media (max-width:760px){
  .side.min .grab b{display:block;font-size:13px;color:var(--muted);text-align:center;margin-top:3px;font-weight:600}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#2a3237"/><path d="M9 7h10v18H9z" fill="#ffc233"/><path d="M11 9h6v5h-6z" fill="#2a3237"/><path d="M19 12h3l2 3v8a1.5 1.5 0 0 1-3 0v-5h-2" fill="none" stroke="#ffc233" stroke-width="2"/></svg>
    <h1>Surtidor Guadalajara<small>Precios oficiales de hoy, provincia de Guadalajara</small></h1>
  </div>
  <nav class="fuels" aria-label="Carburante">
    <button type="button" data-fuel="g95">Gasolina 95</button>
    <button type="button" data-fuel="g98">Gasolina 98</button>
    <button type="button" data-fuel="dsl">Diésel</button>
    <button type="button" data-fuel="glp">GLP</button>
  </nav>
  <div class="actions">
    <button type="button" class="btn" id="locate" title="Centrar en mi ubicación">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span class="lbl">Mi ubicación</span>
    </button>
    <button type="button" class="btn primary" id="refresh" title="Descargar los precios más recientes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span class="lbl">Actualizar</span>
    </button>
  </div>
</header>

<div class="status" id="status" role="status" aria-live="polite">
  <span id="stamp">Cargando precios…</span>
  <span class="legend" aria-hidden="true">
    <span><i class="dot" style="background:var(--cheap)"></i>Barata</span>
    <span><i class="dot" style="background:var(--mid)"></i>Media</span>
    <span><i class="dot" style="background:var(--dear)"></i>Cara</span>
  </span>
</div>

<div class="main">
  <aside class="side" id="side">
    <button type="button" class="grab" id="grab" aria-label="Agrandar o encoger la lista"><i></i><b>Ver la lista</b></button>
    <div class="side-head">
      <input id="q" type="search" placeholder="Busca un pueblo: Guadalajara, Azuqueca…" aria-label="Buscar pueblo o marca" autocomplete="off">
      <select id="sort" aria-label="Ordenar">
        <option value="near">Barata y cerca</option>
        <option value="price">Más barata</option>
        <option value="dist">Más cercana</option>
      </select>
      <div class="suggest" id="suggest" hidden></div>
      <div class="place" id="place" hidden></div>
      <div class="radius" id="radius" role="group" aria-label="Tiempo máximo en coche" hidden>
        <span>Hasta</span>
        <button type="button" data-min="5">5 min</button>
        <button type="button" data-min="10">10 min</button>
        <button type="button" data-min="15">15 min</button>
        <span>en coche</span>
      </div>
      <div class="opts">
        <label class="chk"><input type="checkbox" id="openOnly"> Solo abiertas ahora</label>
        <span class="car">Echo <input id="litres" type="number" min="5" max="150" step="1" inputmode="numeric" aria-label="Litros a repostar"> L · gasta <input id="cons" type="number" min="2" max="25" step="0.1" inputmode="decimal" aria-label="Consumo en litros cada 100 km"> L/100 km</span>
      </div>
      <div class="best" id="best" hidden></div>
      <div class="summary" id="summary"></div>
    </div>
    <ol class="list" id="list"></ol>
  </aside>
  <div id="map" aria-label="Mapa de gasolineras"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  // Provincia (código INE). 19 = Guadalajara.
  const PROVINCIA = 19;
  const API = `https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes/EstacionesTerrestres/FiltroProvincia/${PROVINCIA}`;
  const CACHE_KEY = 'surtidor-gu-v1';
  const AUTO_MS = 30 * 60 * 1000; // el Ministerio publica cambios cada ~30 min

  const FUELS = {
    g95: { label: 'Gasolina 95', short: '95',     key: 'precio gasolina 95 e5' },
    g98: { label: 'Gasolina 98', short: '98',     key: 'precio gasolina 98 e5' },
    dsl: { label: 'Diésel',      short: 'Diésel', key: 'precio gasoleo a' },
    glp: { label: 'GLP',         short: 'GLP',    key: 'precio gases licuados del petroleo' },
  };

  const $ = s => document.querySelector(s);
  const store = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const num = s => { const n = parseFloat(String(s || '').replace(',', '.')); return isFinite(n) && n > 0 ? n : null; };
  const title = s => String(s || '').toLowerCase().replace(/(^|[\s\-/(])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
  const fmt = p => p.toFixed(3).replace('.', ',');

  const saved = store.get('surtidor-prefs') || {};
  const state = {
    fuel: FUELS[saved.fuel] ? saved.fuel : 'g95',
    sort: ['near', 'price', 'dist'].includes(saved.sort) ? saved.sort : 'near',
    radius: [5, 10, 15].includes(saved.radius) ? saved.radius : 10,
    openOnly: saved.openOnly ?? true,
    litres: saved.litres > 0 ? saved.litres : 50,
    cons: saved.cons > 0 ? saved.cons : 6,
    times: new Map(),     // id -> { min, km } en coche desde mi ubicación
    timesApprox: false,
    timesPending: false,
    timesDone: false,
    q: '',
    stations: [],
    fecha: null,
    me: null,          // dónde estás (GPS)
    place: null,       // pueblo buscado: { name, lat, lng }
    selected: null,
  };

  // ---------- mapa ----------
  const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([40.75, -2.6], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, subdomains: 'abc',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · Precios: <a href="https://geoportalgasolineras.es/">Ministerio para la Transición Ecológica</a>',
  }).addTo(map);
  const layer = L.layerGroup().addTo(map);
  let meMarker = null;
  const markers = new Map();

  // ---------- horarios ----------
  // Formatos del Ministerio: "L-D: 24H", "L-V: 06:00-22:00; S-D: 07:00-22:00", "L-S: 08:00-14:00 y 16:00-20:00", "V: 07:00-01:00"…
  const DAYS = 'LMXJVSD';
  function parseHours(h){
    if (!h) return null;
    const rules = [];
    for (const part of h.split(';')){
      const m = part.trim().match(/^([LMXJVSD])(?:-([LMXJVSD]))?:\s*(.+)$/);
      if (!m) return null;
      const a = DAYS.indexOf(m[1]), b = m[2] ? DAYS.indexOf(m[2]) : a;
      const days = [];
      for (let d = a; ; d = (d + 1) % 7){ days.push(d); if (d === b) break; }
      const ranges = [];
      for (const r of m[3].split(/\s+y\s+/)){
        if (/^24\s*H$/i.test(r.trim())){ ranges.push([0, 1440]); continue; }
        const t = r.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
        if (!t) return null;
        const start = +t[1] * 60 + +t[2];
        let end = +t[3] * 60 + +t[4];
        if (end === 0 || end === 1439) end = 1440; // "00:00" o "23:59" = hasta medianoche
        ranges.push([start, end]);
      }
      rules.push({ days, ranges });
    }
    // "L: 24H" a secas es casi siempre un error al rellenarlo: se entiende como todos los días
    if (rules.length === 1 && rules[0].days.length === 1) rules[0].days = [0, 1, 2, 3, 4, 5, 6];
    return rules;
  }
  // { open: true|false|null, until: minuto del cierre }
  function openState(s, now = new Date()){
    if (s.h24) return { open: true, until: null };
    if (!s.sched) return { open: null };
    const d = (now.getDay() + 6) % 7, prev = (d + 6) % 7, t = now.getHours() * 60 + now.getMinutes();
    for (const r of s.sched){
      for (const [a, e] of r.ranges){
        if (r.days.includes(d) && (e > a ? t >= a && t < e : t >= a)) return { open: true, until: e };
        if (r.days.includes(prev) && e <= a && t < e) return { open: true, until: e };
      }
    }
    return { open: false };
  }
  const hhmm = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  function openLabel(s){
    const o = openState(s);
    if (o.open === null) return '';
    if (!o.open) return '<div class="open n">Cerrada ahora</div>';
    if (o.until == null) return '<div class="open y">Abierta 24 horas</div>';
    return `<div class="open y">Abierta ahora · cierra a las ${hhmm(o.until)}</div>`;
  }

  // Desde dónde se miden los tiempos: el pueblo que buscas o, si no, tu ubicación
  const origin = () => state.place || state.me;

  // Centro de cada pueblo: la media de sus gasolineras (así no hace falta otro servicio)
  function towns(){
    const t = new Map();
    for (const s of state.stations){
      const k = s.town;
      if (!t.has(k)) t.set(k, { name: k, lat: 0, lng: 0, n: 0 });
      const o = t.get(k); o.lat += s.lat; o.lng += s.lng; o.n++;
    }
    return [...t.values()].map(o => ({ name: o.name, lat: o.lat / o.n, lng: o.lng / o.n, n: o.n }));
  }

  function goTo(town){
    state.place = { name: town.name, lat: town.lat, lng: town.lng };
    state.q = ''; $('#q').value = '';
    state.selected = null;
    state.times = new Map(); state.timesDone = false;
    if (state.sort === 'price') state.sort = 'near';
    placeMark();
    render(false);
    computeTimes();
    map.closePopup();
  }

  let placeMarker = null;
  function placeMark(){
    if (placeMarker){ placeMarker.remove(); placeMarker = null; }
    if (!state.place) return;
    placeMarker = L.marker([state.place.lat, state.place.lng], {
      icon: L.divIcon({ className: '', html: '<div class="place-dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }),
      zIndexOffset: 4000, title: state.place.name,
    }).addTo(map);
  }

  // ---------- coste real de llenar ----------
  const fmtEur = v => v.toFixed(2).replace('.', ',') + ' €';
  // km por carretera hasta la gasolinera (ruta real si la hay; si no, estimación)
  const tripKm = s => { const t = state.times.get(s.id); const o = origin(); return t ? t.km : o ? km(o, s) * 1.3 : null; };
  // Lo que pagas por los litros + el combustible gastado en ir y volver
  function realCost(s, f = state.fuel){
    const p = s.prices[f], k = tripKm(s);
    const fill = state.litres * p, trip = k == null ? 0 : 2 * k * state.cons / 100 * p;
    return { fill, trip, total: fill + trip };
  }
  // Referencia para el ahorro: la gasolinera más cercana (abierta, con ese carburante)
  function nearestRef(){
    const o = origin();
    if (!o) return null;
    const f = state.fuel;
    let best = null;
    for (const s of state.stations){
      if (s.prices[f] == null) continue;
      if (state.openOnly && openState(s).open === false) continue;
      const t = state.times.get(s.id);
      const v = t ? t.min : km(o, s) * 1.3 / 55 * 60;
      if (!best || v < best.v) best = { s, v };
    }
    return best && best.s;
  }

  // ---------- datos ----------
  function parse(json){
    return (json.ListaEESSPrecio || []).map(raw => {
      const r = {};
      for (const k in raw) r[norm(k)] = raw[k];
      const prices = {};
      for (const f in FUELS) prices[f] = num(r[FUELS[f].key]);
      return {
        id: r.ideess,
        brand: (r.rotulo || 'Sin marca').trim(),
        address: title(r.direccion),
        town: title(r.municipio || r.localidad),
        locality: title(r.localidad),
        cp: r['c.p.'],
        hours: r.horario,
        sched: parseHours(r.horario),
        h24: /^L(-D)?:\s*(24H|00:00-23:59)$/i.test(String(r.horario || '').trim()),
        lat: num(r.latitud),
        lng: parseFloat(String(r['longitud (wgs84)']).replace(',', '.')),
        prices,
      };
    }).filter(s => s.lat && isFinite(s.lng));
  }

  function applyData(json, fromCache){
    state.stations = parse(json);
    state.fecha = json.Fecha || null;
    render(true);
    if (origin() && !state.timesDone && !state.timesPending) computeTimes();
    setStamp(fromCache);
  }

  let loading = false;
  async function load({ quiet = false } = {}){
    if (loading) return;
    loading = true;
    const btn = $('#refresh');
    btn.disabled = true; btn.classList.add('spin');
    try {
      const res = await fetch(API, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      if (!json.ListaEESSPrecio) throw new Error('respuesta vacía');
      const changed = json.Fecha !== state.fecha;
      store.set(CACHE_KEY, json);
      applyData(json, false);
      if (!quiet) toast(changed ? 'Precios actualizados' : 'Ya tenías los precios más recientes');
    } catch (e) {
      console.error(e);
      setStamp(!!state.fecha, 'No se pudo conectar con el Ministerio. Revisa tu conexión y pulsa Actualizar.');
    } finally {
      loading = false;
      btn.disabled = false; btn.classList.remove('spin');
    }
  }

  function setStamp(fromCache, error){
    const el = $('#stamp');
    const n = state.stations.length;
    const withFuel = state.stations.filter(s => s.prices[state.fuel] != null).length;
    const small = matchMedia('(max-width:760px)').matches;
    let html = state.fecha
      ? small
        ? `Precios de las <b>${esc(state.fecha.replace(/^\S+\s/, '').replace(/:\d\d$/, ''))}</b> · ${withFuel} con ${FUELS[state.fuel].label}`
        : `Datos del Ministerio: <b>${esc(state.fecha.replace(/:\d\d$/, ''))}</b> · ${n} gasolineras, ${withFuel} con ${FUELS[state.fuel].label}`
      : 'Sin datos todavía';
    if (fromCache && !error) html += ' · (copia guardada, comprobando…)';
    if (error) html += ` · <span class="err">${esc(error)}</span>`;
    el.innerHTML = html;
  }

  // ---------- colores por precio ----------
  function thresholds(list){
    const p = list.map(s => s.prices[state.fuel]).filter(v => v != null).sort((a, b) => a - b);
    if (!p.length) return [0, 0];
    const q = f => p[Math.min(p.length - 1, Math.floor(f * p.length))];
    return [q(1/3), q(2/3)];
  }
  const colorFor = (p, [a, b]) => p == null ? 'var(--none)' : p <= a ? 'var(--cheap)' : p <= b ? 'var(--mid)' : 'var(--dear)';

  // ---------- distancia ----------
  function km(a, b){
    const R = 6371, rad = x => x * Math.PI / 180;
    const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const fmtKm = d => d < 1 ? `${Math.round(d * 1000)} m` : `${d.toFixed(d < 10 ? 1 : 0).replace('.', ',')} km`;
  const fmtMin = m => `${state.timesApprox ? '≈ ' : ''}${Math.max(1, Math.round(m))} min`;
  const savePrefs = () => store.set('surtidor-prefs', { fuel: state.fuel, sort: state.sort, radius: state.radius, openOnly: state.openOnly, litres: state.litres, cons: state.cons });

  // ---------- tiempo en coche (OSRM, servicio público de rutas sobre OpenStreetMap) ----------
  let timesSeq = 0;
  async function computeTimes(){
    const o = origin();
    if (!o || !state.stations.length) return;
    const seq = ++timesSeq;
    // Solo las que están a menos de 35 km en línea recta: ninguna más lejana queda a 15 min
    const cands = state.stations.filter(s => km(o, s) <= 35);
    state.timesPending = true; render(false);
    const times = new Map();
    let approx = false;
    try {
      if (!cands.length) throw new Error('sin candidatas');
      const coords = [o, ...cands].map(p => `${p.lng.toFixed(5)},${p.lat.toFixed(5)}`).join(';');
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 9000);
      const res = await fetch(`https://router.project-osrm.org/table/v1/driving/${coords}?sources=0&annotations=duration,distance`, { signal: ctrl.signal });
      clearTimeout(timer);
      const j = await res.json();
      if (j.code !== 'Ok') throw new Error(j.code);
      cands.forEach((s, i) => {
        const sec = j.durations[0][i + 1], m = j.distances[0][i + 1];
        if (sec != null) times.set(s.id, { min: sec / 60, km: m / 1000 });
      });
    } catch (e) {
      console.warn('Tiempos estimados por distancia:', e);
      approx = true;
      // Estimación: carretera ≈ 1,3 × línea recta, a unos 55 km/h de media
      cands.forEach(s => { const d = km(o, s) * 1.3; times.set(s.id, { min: d / 55 * 60, km: d }); });
    }
    if (seq !== timesSeq) return;
    state.times = times; state.timesApprox = approx; state.timesPending = false; state.timesDone = true;
    render(state.sort === 'near');
  }

  // ---------- pintar ----------
  function render(fit){
    const f = state.fuel;
    document.querySelectorAll('.fuels button').forEach(b => b.setAttribute('aria-pressed', b.dataset.fuel === f));
    document.querySelectorAll('#radius button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.min === state.radius));
    $('#sort').value = state.sort;

    const near = state.sort === 'near';
    const orig = origin();
    const nearReady = near && orig && !state.timesPending && state.timesDone;
    $('#radius').hidden = !near;

    const q = norm(state.q);
    const matches = s => !q || norm(`${s.brand} ${s.town} ${s.locality} ${s.address} ${s.cp}`).includes(q);
    const inRadius = s => { const t = state.times.get(s.id); return t && t.min <= state.radius; };
    const isOpen = s => openState(s).open !== false;
    let visible = state.stations.filter(s => matches(s) && (!state.openOnly || isOpen(s)));
    if (nearReady) visible = visible.filter(inRadius);
    const th = thresholds(state.stations);

    // marcadores
    layer.clearLayers(); markers.clear();
    for (const s of visible){
      const p = s.prices[f];
      if (nearReady && p == null) continue;
      const cls = ['pin', p == null ? 'na' : '', s.id === state.selected ? 'sel' : '', isOpen(s) ? '' : 'closed'].join(' ');
      const icon = L.divIcon({
        className: '', iconSize: null,
        html: `<div class="${cls}" style="--c:${colorFor(p, th)}"><span>${p == null ? esc(s.brand.slice(0, 10)) : fmt(p)}</span></div>`,
      });
      const m = L.marker([s.lat, s.lng], { icon, zIndexOffset: p == null ? -1000 : Math.round((3 - p) * 1000), title: s.brand, keyboard: true })
        .bindPopup(() => popup(s), { maxWidth: 280 })
        .on('click', () => select(s.id, false));
      m.addTo(layer);
      markers.set(s.id, m);
    }

    // lista
    const withPrice = visible.filter(s => s.prices[f] != null);
    withPrice.forEach(s => { s.d = orig ? km(orig, s) : null; s.t = state.times.get(s.id) || null; });
    const byTime = (a, b) => (a.t?.min ?? 1e9) - (b.t?.min ?? 1e9) || (a.d ?? 0) - (b.d ?? 0);
    const ref = nearestRef();
    withPrice.forEach(s => { s.cost = realCost(s); });
    const bySort = state.sort === 'dist' && orig
      ? (a, b) => (a.t && b.t ? byTime(a, b) : a.d - b.d)
      : state.sort === 'near' && orig
        ? (a, b) => a.cost.total - b.cost.total || byTime(a, b)
        : (a, b) => a.prices[f] - b.prices[f] || byTime(a, b);
    withPrice.sort(bySort);

    const list = $('#list');
    if (!state.stations.length){
      list.innerHTML = '<li class="empty">Descargando precios…</li>';
    } else if (nearReady && !withPrice.length){
      list.innerHTML = `<li class="empty">No hay ninguna gasolinera con ${esc(FUELS[f].label)} a ${state.radius} min o menos${q ? ' que coincida con la búsqueda' : ''}. Prueba con más minutos.</li>`;
    } else if (!withPrice.length){
      list.innerHTML = `<li class="empty">Ninguna gasolinera ${q ? 'que coincida con la búsqueda ' : ''}vende ${esc(FUELS[f].label)}.</li>`;
    } else {
      list.innerHTML = withPrice.map((s, i) => `
        <li class="item${s.id === state.selected ? ' sel' : ''}${isOpen(s) ? '' : ' closed'}" data-id="${esc(s.id)}" tabindex="0">
          <span class="rank">${i + 1}</span>
          <span class="name">${esc(title(s.brand))}${isOpen(s) ? '' : '<span class="tag">Cerrada</span>'}</span>
          <span class="price"><span class="plate" style="--c:${colorFor(s.prices[f], th)}">${fmt(s.prices[f])}<sub>€/l</sub></span>${where(s)}${saving(s, ref)}</span>
          <span class="where">${esc(s.town)} · ${esc(s.address)}</span>
        </li>`).join('');
    }

    // recuadro "la más barata cerca"
    const best = $('#best');
    best.hidden = !near || !state.stations.length;
    best.className = 'best';
    if (near && !orig){
      best.className = 'best msg';
      best.innerHTML = 'Escribe un pueblo arriba, o pulsa <b>Mi ubicación</b>, para ver la más barata que pilla cerca.';
    } else if (near && !nearReady){
      best.className = 'best msg';
      best.textContent = 'Calculando el tiempo en coche hasta cada gasolinera…';
    } else if (near && withPrice.length){
      const b = withPrice[0];
      best.dataset.id = b.id;
      best.innerHTML = `<span class="k">Lo más barato a ${state.radius} min o menos, contando el viaje</span>
        <span class="n">${esc(title(b.brand))}</span>
        <span class="plate" style="--c:${colorFor(b.prices[f], th)}">${fmt(b.prices[f])}<sub>€/l</sub></span>
        <span class="w">${esc(b.town)} · ${fmtMin(b.t.min)} en coche (${fmtKm(b.t.km)})</span>
        <span class="x">${bestLine(b, ref)}</span>`;
    } else if (near){
      best.className = 'best msg';
      best.textContent = `Nada con ${FUELS[f].label} a ${state.radius} min o menos.`;
    }

    const cheapest = withPrice.length ? Math.min(...withPrice.map(s => s.prices[f])) : null;
    const avg = withPrice.length ? withPrice.reduce((t, s) => t + s.prices[f], 0) / withPrice.length : null;
    $('#summary').textContent = withPrice.length
      ? `${withPrice.length} con ${FUELS[f].label}${nearReady ? ` a ${state.radius} min o menos` : ''} · desde ${fmt(cheapest)} €/l · media ${fmt(avg)} €/l${state.timesApprox && orig ? ' · tiempos aproximados' : ''}`
      : '';

    if (fit && !state.selected){
      const base = withPrice.length ? withPrice : visible;
      const pts = base.map(s => [s.lat, s.lng]);
      if (orig && state.sort !== 'price'){
        if (state.sort === 'dist') pts.splice(8);
        pts.push([orig.lat, orig.lng]);
      }
      if (pts.length){
        map.invalidateSize();
        // En el móvil la lista tapa la parte de abajo del mapa: se deja ese hueco libre
        const hidden = matchMedia('(max-width:760px)').matches ? $('#side').getBoundingClientRect().height : 0;
        map.fitBounds(pts, { paddingTopLeft: [40, 40], paddingBottomRight: [40, 40 + hidden], maxZoom: 14, animate: false });
      }
    }
    // pueblo elegido y sugerencias mientras escribes
    const place = $('#place');
    place.hidden = !state.place;
    if (state.place){
      place.innerHTML = `Viendo lo que hay cerca de <b>${esc(state.place.name)}</b>` +
        `<button type="button" id="clearPlace">${state.me ? 'Volver a mi ubicación' : 'Quitar'}</button>`;
      $('#clearPlace').addEventListener('click', clearPlace);
    }
    suggest();

    setStamp(false);
  }

  function suggest(){
    const box = $('#suggest');
    const q = norm(state.q);
    const hits = q.length >= 2
      ? towns().filter(t => norm(t.name).includes(q)).sort((a, b) => b.n - a.n).slice(0, 4)
      : [];
    box.hidden = !hits.length;
    if (!hits.length) return;
    box.innerHTML = hits.map(t => `<button type="button" data-town="${esc(t.name)}">Ver ${esc(t.name)}<small>${t.n}</small></button>`).join('');
    box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      const t = towns().find(x => x.name === b.dataset.town);
      if (t) goTo(t);
    }));
  }

  function clearPlace(){
    state.place = null;
    state.times = new Map(); state.timesDone = false;
    state.selected = null;
    placeMark();
    render(false);
    if (state.me) computeTimes(); else render(true);
  }

  function saving(s, ref){
    if (!ref || !origin()) return '';
    if (s.id === ref.id) return '<span class="save neg">la más cercana</span>';
    const diff = realCost(ref).total - s.cost.total;
    if (Math.abs(diff) < 0.05) return '<span class="save neg">igual que la cercana</span>';
    return diff > 0
      ? `<span class="save pos">ahorras ${fmtEur(diff)}</span>`
      : `<span class="save neg">${fmtEur(-diff)} más</span>`;
  }

  function bestLine(b, ref){
    const c = b.cost;
    let txt = `Echar ${state.litres} L: <b>${fmtEur(c.fill)}</b>`;
    if (c.trip >= 0.01) txt += ` + ${fmtEur(c.trip)} de ir y volver`;
    if (ref && ref.id !== b.id){
      const diff = realCost(ref).total - c.total;
      if (diff >= 0.05) txt += `. Ahorras <b>${fmtEur(diff)}</b> frente a ${esc(title(ref.brand))}, la más cercana.`;
    } else if (ref) txt += '. Además es la más cercana.';
    return txt;
  }

  function where(s){
    if (s.t) return `<span class="dist">${fmtMin(s.t.min)} · ${fmtKm(s.t.km)}</span>`;
    if (s.d != null) return `<span class="dist">${fmtKm(s.d)}</span>`;
    return '';
  }

  function popup(s){
    const rows = Object.entries(FUELS).map(([k, f]) => {
      const p = s.prices[k];
      return p == null ? '' : `<tr class="${k === state.fuel ? 'cur' : ''}"><td>${f.label}</td><td>${fmt(p)} €/l</td></tr>`;
    }).join('') || '<tr><td>Sin precios de estos carburantes</td><td></td></tr>';
    const go = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}`;
    const t = state.times.get(s.id);
    const o = origin();
    const dist = t ? ` · ${fmtMin(t.min)} en coche (${fmtKm(t.km)})` : o ? ` · a ${fmtKm(km(o, s))}` : '';
    return `<div class="pop">
      <h3>${esc(title(s.brand))}</h3>
      <div class="addr">${esc(s.address)}, ${esc(s.locality || s.town)}${dist}</div>
      ${openLabel(s)}
      <table>${rows}</table>
      ${fillBox(s)}
      ${s.hours ? `<div class="hours">Horario: ${esc(s.hours)}</div>` : ''}
      <a class="go" href="${go}" target="_blank" rel="noopener">Cómo llegar (Google Maps)</a>
    </div>`;
  }

  function fillBox(s){
    if (s.prices[state.fuel] == null) return '';
    const c = realCost(s);
    let txt = `Echar ${state.litres} L de ${FUELS[state.fuel].label}: <b>${fmtEur(c.fill)}</b>`;
    if (c.trip >= 0.01) txt += `<br>Ir y volver: ${fmtEur(c.trip)} de combustible`;
    const ref = nearestRef();
    if (ref && ref.id !== s.id){
      const diff = realCost(ref).total - c.total;
      if (diff >= 0.05) txt += `<br>Ahorras <b>${fmtEur(diff)}</b> frente a la más cercana`;
      else if (diff <= -0.05) txt += `<br>Te cuesta ${fmtEur(-diff)} más que la más cercana`;
    }
    return `<div class="fill">${txt}</div>`;
  }

  function select(id, fly){
    state.selected = id;
    document.querySelectorAll('.item').forEach(el => el.classList.toggle('sel', el.dataset.id === id));
    document.querySelectorAll('.pin.sel').forEach(el => el.classList.remove('sel'));
    const m = markers.get(id);
    if (!m) return;
    m.getElement()?.querySelector('.pin')?.classList.add('sel');
    if (fly){
      map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 14), { duration: .6 });
      map.once('moveend', () => m.openPopup());
      if (matchMedia('(max-width:760px)').matches) sheet('min'); // deja ver el mapa
    }
  }

  // ---------- ubicación ----------
  function locate({ silent = false } = {}){
    if (!navigator.geolocation){ if (!silent) toast('Tu navegador no permite obtener la ubicación'); return; }
    const btn = $('#locate'); btn.disabled = true;
    navigator.geolocation.getCurrentPosition(pos => {
      btn.disabled = false;
      state.me = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (meMarker) meMarker.remove();
      meMarker = L.marker([state.me.lat, state.me.lng], {
        icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }),
        zIndexOffset: 5000, title: 'Estás aquí',
      }).addTo(map);
      if (state.sort === 'price') state.sort = 'near';
      state.place = null; placeMark();     // vuelves a tu posición
      state.selected = null;
      state.times = new Map(); state.timesDone = false;
      render(false);
      if (state.sort !== 'near') map.flyTo([state.me.lat, state.me.lng], 12, { duration: .8 });
      computeTimes();
    }, err => {
      btn.disabled = false;
      if (!silent) toast(err.code === 1 ? 'Permiso de ubicación denegado. Actívalo en el navegador para usarlo.' : 'No se pudo obtener tu ubicación');
    }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  }

  let toastTimer;
  function toast(msg){
    let t = $('.toast');
    if (!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600);
  }

  // ---------- eventos ----------
  document.querySelectorAll('.fuels button').forEach(b => b.addEventListener('click', () => {
    state.fuel = b.dataset.fuel; state.selected = null;
    savePrefs();
    map.closePopup(); render(state.sort === 'near');
  }));
  $('#refresh').addEventListener('click', () => load());
  $('#locate').addEventListener('click', locate);
  $('#q').addEventListener('input', e => { state.q = e.target.value; state.selected = null; render(true); });
  // Enter: si lo escrito es un pueblo, centra la búsqueda ahí
  $('#q').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const q = norm(state.q);
    if (q.length < 2) return;
    const list = towns().filter(t => norm(t.name).includes(q)).sort((a, b) => b.n - a.n);
    const exact = list.find(t => norm(t.name) === q) || list[0];
    if (exact){ e.preventDefault(); goTo(exact); }
  });
  $('#sort').addEventListener('change', e => {
    state.sort = e.target.value; state.selected = null;
    savePrefs();
    if (state.sort !== 'price' && !origin()){ render(false); locate(); return; }
    render(true);
  });
  document.querySelectorAll('#radius button').forEach(b => b.addEventListener('click', () => {
    state.radius = +b.dataset.min; state.selected = null;
    savePrefs(); map.closePopup();
    if (!origin()){ render(false); locate(); return; }
    render(true);
  }));
  $('#openOnly').checked = state.openOnly;
  $('#litres').value = state.litres;
  $('#cons').value = state.cons;
  $('#openOnly').addEventListener('change', e => { state.openOnly = e.target.checked; state.selected = null; savePrefs(); map.closePopup(); render(false); });
  const numInput = (id, key, min, max) => $(id).addEventListener('change', e => {
    const v = parseFloat(String(e.target.value).replace(',', '.'));
    if (isFinite(v) && v >= min && v <= max){ state[key] = v; savePrefs(); render(false); }
    else e.target.value = state[key];
  });
  numInput('#litres', 'litres', 5, 150);
  numInput('#cons', 'cons', 2, 25);
  // Las gasolineras abren y cierran: repinta cada 5 minutos si no estás mirando una
  setInterval(() => { if (!state.selected && !document.hidden) render(false); }, 5 * 60 * 1000);
  $('#best').addEventListener('click', e => { const id = e.currentTarget.dataset.id; if (id && !e.currentTarget.classList.contains('msg')) select(id, true); });
  const pick = el => { const li = el.closest('.item'); if (li) select(li.dataset.id, true); };
  $('#list').addEventListener('click', e => pick(e.target));
  $('#list').addEventListener('keydown', e => { if (e.key === 'Enter') pick(e.target); });
  // El panel de la lista en el móvil: pequeño → medio → grande
  const sheet = (mode) => {
    const el = $('#side');
    el.classList.remove('min', 'max');
    if (mode) el.classList.add(mode);
    setTimeout(() => map.invalidateSize(), 300);
  };
  $('#grab').addEventListener('click', () => {
    const el = $('#side');
    sheet(el.classList.contains('min') ? null : el.classList.contains('max') ? 'min' : 'max');
  });
  map.on('popupclose', () => { state.selected = null; document.querySelectorAll('.sel').forEach(el => el.classList.remove('sel')); });

  // Actualización automática: al abrir, cada 30 min, y al volver a la pestaña
  let last = 0;
  const autoLoad = () => { last = Date.now(); load({ quiet: true }); };
  setInterval(() => { if (!document.hidden) autoLoad(); }, AUTO_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - last > AUTO_MS) autoLoad(); });

  addEventListener('resize', () => map.invalidateSize());

  // Arranque: pinta la última copia al instante y descarga la nueva
  const cached = store.get(CACHE_KEY);
  if (cached && cached.ListaEESSPrecio) applyData(cached, true); else render(false);
  autoLoad();

  // Si ya diste permiso de ubicación antes, te localiza sola al abrir
  navigator.permissions?.query({ name: 'geolocation' })
    .then(p => { if (p.state === 'granted') locate({ silent: true }); })
    .catch(() => {});
})();
</script>
</body>
</html>
